name: 環境の不具合
description: Dev Container の作成、コミット、push、テストの実行などがうまくいかない
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 起きたこと
      description: 何をしたら、どうなったか。エラーの表示があれば、そのまま貼ってください。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待したこと
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: 操作した場所
      options:
        - Dev Container の中
        - ホスト（Dev Container の外）
        - Live Share のゲスト
        - わからない
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: ホストの OS と Docker
      placeholder: '例: Windows 11 + WSL2 + Docker Desktop / macOS (Apple silicon) + Docker Desktop'
  - type: textarea
    id: doctor
    attributes:
      label: make doctor の出力
      description: |
        Dev Container のターミナルで `make doctor` を実行し、出力を貼ってください。
        メールアドレスやトークンは伏せて表示されますが、すべての秘密を伏せられるわけではありません。貼る前に目を通してください。
      render: text
